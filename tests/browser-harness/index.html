<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>zentao 面板 · 浏览器 harness</title>
<style>
  /* The panel is position:fixed, so the page only needs a backdrop. */
  html, body { margin: 0; height: 100%; background: #0f1012; color: #d0d0d0;
    font: 13px system-ui, -apple-system, "PingFang SC", sans-serif; }
  #hint { padding: 14px 16px; color: #8a8a8a; line-height: 1.7; }
  /* ?layout=clipped reproduces the shell's overlay: a transformed ancestor
     becomes the containing block for position:fixed, and overflow:hidden clips
     anything placed with viewport math. */
  /* ?layout=autoheight reproduces the shell that made the drawer collapse:
     the transformed ancestor establishes the containing block but has NO
     definite height, so `height: 100%` resolves to auto (content height). */
  #auto { position: absolute; left: 0; top: 0; right: 0; transform: translateZ(0); }
  #clip { position: absolute; left: 240px; top: 160px; width: 520px; height: 360px;
    border: 1px dashed #4b5563; border-radius: 8px;
    transform: translateZ(0); overflow: hidden; background: rgba(255,255,255,.02); }
  #hint code { color: #d8d8d8; }
</style>
</head>
<body>
<div id="hint">
  <div>这是 <b>dsh-zentao-workbench</b> 浏览器半边的离线 harness：</div>
  <div>· 用同款模块加载契约（<code>window.__ModuleLoader__.load({id,factory})</code>）挂载真实的 <code>lib/client.js</code></div>
  <div>· React 18 UMD 真渲染，宿主侧 <code>/zentao</code> RPC 用假数据顶替</div>
  <div>· 页面载入后自动展开面板，于是不用重启 DSH 也能看到它长什么样</div>
  <div id="status">（等待 bundle 挂载…）</div>
</div>
<div id="root"></div>
<div id="clip" style="display:none"><div id="clipRoot"></div></div>
<div id="auto" style="display:none"><div id="autoRoot"></div></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script>
  // ---- stub host: capture the module definition, then mount -----------------
  window.__CALLS__ = []
  window.__HARNESS__ = { ready: false, error: null }

  let definition
  window.__ModuleLoader__ = {
    load: (value) => { definition = value },
  }

  // severityLevel mirrors the real markup's data-severity, so the harness shows
  // the same colour scale the live instance will.
  const BUGS = [
    { id: '55036', title: '查询条件location浮层问题', severity: '主要', severityLevel: 3, pri: '3', type: '需求逻辑问题', assignedTo: 'dev.one', resolution: '', href: '/index.php?m=bug&f=view&bugID=55036' },
    { id: '55035', title: '支付回调偶发超时（示例：致命）', severity: '致命', severityLevel: 1, pri: '1', type: '代码错误', assignedTo: 'dev.one', resolution: '', href: '/index.php?m=bug&f=view&bugID=55035' },
    { id: '55004', title: '使用profile字段搜索时未清空右侧location信息', severity: '次要', severityLevel: 4, pri: '2', type: '代码错误', assignedTo: 'dev.one', resolution: 'fixed', href: '/index.php?m=bug&f=view&bugID=55004' },
  ]

  // `?state=unauth` renders the not-logged-in panel (the four-strategy report),
  // which is the state the user asked to be shown plainly rather than as "未登录".
  const params = new URLSearchParams(location.search)
  const UNAUTH = params.get('state') === 'unauth'
  // Mount inside the transformed/clipped container to reproduce the shell.
  const LAYOUT = params.get('layout') ?? 'plain'
  const CLIPPED = LAYOUT === 'clipped'
  const AUTOHEIGHT = LAYOUT === 'autoheight'
  if (LAYOUT !== 'plain') document.getElementById('root').style.display = 'none'
  if (CLIPPED) document.getElementById('clip').style.display = 'block'
  if (AUTOHEIGHT) document.getElementById('auto').style.display = 'block'
  const UNAUTH_PROBES = [
    { id: 'bridge', label: '浏览器插件桥', ready: true, detail: '守护进程在运行；扩展轮询标志为 false（该标志不可靠，以实测为准）', hint: '守护进程在，但扩展没有在轮询：打开 Chrome 确认 dsh-fetch-page 扩展已启用，然后重试' },
    { id: 'cookie-jar', label: 'Chrome cookie 导出', ready: true, detail: 'jar 可用（10 个 cookie，3 个会话级），导出时间 2026/9/28 16:37:16', hint: '含会话级 cookie：浏览器一关就失效，需要时重新导出' },
    { id: 'form-login', label: '表单账密登录', ready: false, detail: '没有可用的账密凭据', hint: '面板里点「账密登录」，或设环境变量 ZENTAO_ACCOUNT / ZENTAO_PASSWORD（不要写进插件配置）' },
    { id: 'manual', label: '手工注入', ready: false, detail: '未提供 ZENTAO_COOKIE', hint: '把 Cookie 串放进环境变量 ZENTAO_COOKIE（不要写进插件配置）' },
    { id: 'cookie-jar', label: 'Chrome cookie 导出', ready: true, detail: '会话已失效（页面被弹回登录页）', hint: '可在终端跑 ~/.local/bin/zentao-export-cookies 重新导出（会读 Keychain），或改用浏览器桥' },
  ]

  // The panel now POSTs { endpoint, payload } to /api/zentao, so the harness
  // intercepts fetch instead of an rpc service.
  const answer = (endpoint, payload) => {
    switch (endpoint) {
      case 'getConfig':
      case 'sessionStatus':
        return UNAUTH
          ? { ok: true, value: { server: '', serverSource: 'none', authenticated: false, probes: UNAUTH_PROBES, config: { server: '', authenticated: false, probes: UNAUTH_PROBES } } }
          : { ok: true, value: { server: 'https://zentao.example.com', serverSource: 'config', authenticated: true, strategy: 'bridge', probes: [{ id: 'bridge', label: '浏览器插件桥', ready: true, detail: '守护进程在运行；扩展轮询标志为 false（以实测为准）' }], config: { server: 'https://zentao.example.com', authenticated: true, probes: [] } } }
      case 'listBugs':
        return { ok: true, value: { bugs: BUGS, total: BUGS.length, truncated: false, via: 'bridge', url: 'https://zentao.example.com/index.php?m=my&f=bug', fetchedAt: new Date().toISOString(), cached: false } }
      case 'listProjects':
        return { ok: true, value: { projects: [{ id: '187', name: 'Upsell STUAT' }, { id: '213', name: 'SPMS UAT' }], via: 'bridge', url: '', fetchedAt: new Date().toISOString() } }
      case 'listTasks':
        return { ok: true, value: { tasks: [], total: 0, empty: true, via: 'bridge', url: '', fetchedAt: new Date().toISOString(),
          note: '该项目（或本实例）没有任务数据；实测本实例 8 个项目全部为空 —— 这里是如实反映，不是解析失败' } }
      case 'bugContext':
        return { ok: true, value: {
          bug: { id: '55036', title: '查询条件location浮层问题', product: 'Service360', productLabel: 'Service360', status: '激活', assignedTo: 'Dev One', severity: '主要', severityLevel: 3, story: '#3982 GReAT优化', storyID: '3982', url: 'https://zentao.example.com/index.php?m=bug&f=view&bugID=55036' },
          resolve: {
            uid: 'kuid-harness',
            fields: [
              { name: 'resolution', label: '解决方案', required: true },
              { name: 'reason', label: 'Bug产生原因', required: true },
              { name: 'bugInchargedBy', label: 'Bug所属人', required: true },
              { name: 'changeImpact', label: '代码变更影响范围', required: true },
              { name: 'detail_reason', label: 'bug详细原因', limit: 512 },
            ],
            defaults: { resolution: 'fixed', reason: 'codeBug', bugInchargedBy: '', assignedTo: 'Yanping.Wang', resolvedBuild: '', resolvedDate: '2026-09-28 17:05:00', changeImpact: '' },
            resolutionOptions: [{ value: 'fixed', text: '已解决' }],
            reasonOptions: [{ value: 'codeBug', text: '代码错误' }],
            buildMatches: [],
            optionCounts: { resolvedBuild: 254, bugInchargedBy: 892, assignedTo: 892 },
          },
          histories: ['2026-08-18 16:27:16, 由 Reporter One 创建。'],
          cachedAt: new Date().toISOString(), cached: false,
        } }
      case 'resolvePlan':
        return { ok: true, value: { plan: {
          bugID: '55036', status: '激活',
          fields: [['resolution', 'fixed'], ['reason', 'codeBug'], ['bugInchargedBy', 'Dev One'], ['assignedTo', 'Yanping.Wang'], ['changeImpact', '本次改动影响范围：Service360（自动填充）']],
          problems: [], autoFilled: { changeImpact: '服务端必填但表单为空，已自动填充最小可接受内容' },
          notes: [], blocked: false,
        } } }
      default:
        return { ok: false, error: { code: 'stub', message: 'harness 未提供该 endpoint：' + endpoint } }
    }
  }

  const realFetch = window.fetch.bind(window)
  window.fetch = async (input, init) => {
    const url = String(typeof input === 'string' ? input : input?.url ?? input)
    if (url.includes('/api/zentao')) {
      const body = JSON.parse(String(init?.body ?? '{}'))
      window.__CALLS__.push({ endpoint: body.endpoint, payload: body.payload ?? null })
      const result = answer(body.endpoint, body.payload)
      return new Response(JSON.stringify(result), { status: 200, headers: { 'content-type': 'application/json' } })
    }
    return realFetch(input, init)
  }

  const ctx = {
    slots: {
      inject: (_name, callback) => callback(),
      register: (_options, component) => { window.__PANEL__ = component; return () => undefined },
    },
    // No sessions/workspaces in the harness: the "处理" button then reports the
    // graceful message the real panel gives when those services are absent.
    get: () => undefined,
    effect: () => undefined,
  }
</script>

<script src="vendor/client.js"></script>

<script>
  const clipMount = () => (CLIPPED ? 'clipRoot' : AUTOHEIGHT ? 'autoRoot' : 'root')
  const status = document.getElementById('status')
  try {
    if (definition === undefined) throw new Error('bundle 没有调用 window.__ModuleLoader__.load')
    const module = definition.factory((name) => {
      if (name === 'react') return window.React
      throw new Error('bundle 请求了未预期的包：' + name)
    })
    window.__HARNESS__.module = module
    module.apply(ctx)
    if (window.__PANEL__ === undefined) throw new Error('apply() 没有注册面板组件')

    window.__HARNESS__.mountPoint = CLIPPED ? 'clipRoot' : 'root'
    window.ReactDOM.createRoot(document.getElementById(clipMount())).render(
      window.React.createElement(window.__PANEL__, {}),
    )
    window.__HARNESS__.ready = true
    status.textContent = 'bundle 已挂载（id=' + definition.id + '，inject=' + JSON.stringify(module.inject) + '）'

    // Auto-open the panel so a screenshot shows the real thing, then open the
    // first bug's detail so the card and the plan preview are exercised too.
    window.__HARNESS__.openPanel = async () => {
      const button = document.querySelector('[data-zentao-entry]')
      if (button === null) throw new Error('找不到悬浮入口按钮')
      button.click()
      await new Promise((resolve) => setTimeout(resolve, 60))
      const row = UNAUTH ? null : document.querySelector('div[draggable="true"]')
      if (row !== null) {
        row.click()
        await new Promise((resolve) => setTimeout(resolve, 80))
        const planButton = Array.from(document.querySelectorAll('button')).find((node) => node.textContent.includes('预览解决计划'))
        if (planButton !== undefined) {
          planButton.click()
          await new Promise((resolve) => setTimeout(resolve, 80))
        }
      }
    }
    // `?auto=0` keeps the drawer closed so the right-edge tab can be measured.
    if (params.get('auto') !== '0') {
      setTimeout(() => { window.__HARNESS__.openPanel().catch((error) => { window.__HARNESS__.error = String(error) }) }, 120)
    }
  } catch (error) {
    window.__HARNESS__.error = String(error && error.message ? error.message : error)
    status.textContent = '挂载失败：' + window.__HARNESS__.error
  }
</script>
</body>
</html>
